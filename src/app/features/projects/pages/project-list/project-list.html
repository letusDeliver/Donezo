<h2>Projects</h2>

<p-table [value]="projects">
  <ng-template pTemplate="header">
    <tr>
      <th>Name</th>
      <th>Status</th>
      <th>Created</th>
      <th>Actions</th>
    </tr>
  </ng-template>

  <ng-template pTemplate="body" let-project>
    <tr>
      <td>{{ project.name }}</td>
      <td>{{ project.status }}</td>
      <td>{{ project.createdAt | date }}</td>

      <td>
        <button pButton label="Edit"></button>
      </td>
    </tr>
  </ng-template>
</p-table>
