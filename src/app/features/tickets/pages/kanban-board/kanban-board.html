<div class="kanban-wrapper">
  <!-- Filters (sticky) -->
  <div class="filters-bar">
    <app-ticket-filters (filtersChange)="applyFilters($event)" />
  </div>

  <!-- Scroll hint (right fade) -->
  <div class="scroll-hint"></div>

  <!-- Board -->
  <div class="kanban-board" role="region" aria-label="Kanban Board">
    @for (col of statuses; track col.key) {
      <div class="kanban-column-wrapper">
        <app-kanban-column
          [title]="col.label"
          [status]="col.key"
          [tickets]="columns()[col.key].data"
          [loading]="columns()[col.key].loading"
        />
      </div>
    }
  </div>
</div>
