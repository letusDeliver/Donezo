<div class="filters-container">
  <!-- Toolbar -->
  <div class="filters-toolbar">
    <!-- Search -->
    <div class="search-box">
      <i class="pi pi-search"></i>

      <input
        pInputText
        placeholder="Search tickets..."
        [ngModel]="filters().search"
        (ngModelChange)="set('search', $event)"
        aria-label="Search tickets"
      />

      @if (filters().search) {
        <button class="clear-icon" (click)="set('search', '')" aria-label="Clear search">✕</button>
      }
    </div>

    <!-- Filters -->
    <div class="filters-group">
      <p-select
        class="filter-dropdown"
        [options]="priorities"
        [ngModel]="filters().priority"
        (ngModelChange)="set('priority', $event)"
        optionLabel="name"
        optionValue="code"
        placeholder="Priority"
        appendTo="body"
      />

      <p-select
        class="filter-dropdown"
        [options]="types"
        [ngModel]="filters().type"
        (ngModelChange)="set('type', $event)"
        optionLabel="name"
        optionValue="code"
        placeholder="Type"
        appendTo="body"
      />

      <p-select
        class="filter-dropdown"
        [options]="assignees"
        [ngModel]="filters().assignee"
        (ngModelChange)="set('assignee', $event)"
        optionLabel="name"
        optionValue="code"
        placeholder="Assignee"
        appendTo="body"
      />
    </div>

    <!-- Clear -->
    @if (activeFilters().length) {
      <button class="clear-btn" (click)="clearAll()">Clear</button>
    }
  </div>

  <!-- Chips -->
  @if (activeFilters().length) {
    <div class="chips">
      @for (filter of activeFilters(); track filter.key) {
        <span class="chip">
          {{ filter.label }}
          <button (click)="set(filter.key, '')" aria-label="Remove filter">✕</button>
        </span>
      }
    </div>
  }
</div>
