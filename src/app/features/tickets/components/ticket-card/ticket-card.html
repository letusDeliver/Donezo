<div
  class="ticket-card"
  tabindex="0"
  role="button"
  [attr.aria-label]="'Ticket ' + ticket.title"
>

  <div class="ticket-id">{{ ticket.id }}</div>

  <div class="ticket-title">
    {{ ticket.title }}
  </div>

  <div class="ticket-footer">

    <span class="priority" [ngClass]="ticket.priority">
      {{ ticket.priority }}
    </span>

    <span class="avatar">
      {{ ticket.assignee }}
    </span>

  </div>

</div>
