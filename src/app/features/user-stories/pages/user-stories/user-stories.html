<div class="card">
  <p-table
    [value]="stories()"
    dataKey="id"
    [rows]="10"
    [size]="'small'"
    [rowsPerPageOptions]="[10, 25, 50]"
    [loading]="loading()"
    [paginator]="stories().length > 10"
    showGridlines
  >
    <ng-template #caption>
      <div class="search_filter_container">
        <div class="search-field">
          <p-iconfield iconPosition="left" class="ml-auto">
            <p-inputicon>
              <i class="pi pi-search"></i>
            </p-inputicon>
            <input pInputText type="text" placeholder="Search keyword" />
          </p-iconfield>
        </div>
        <div class="add-button">
          <p-button
            label="New"
            class="pe-2"
            [outlined]="true"
            icon="pi pi-plus"
            (click)="openNew()"
          />
          <p-button label="AI" [outlined]="true" icon="pi pi-plus" (click)="createWithAi()" />
        </div>
      </div>
    </ng-template>
    <ng-template #header>
      <tr>
        <th style="min-width: 15rem">
          <div class="flex items-center justify-between">Title</div>
        </th>
        <th style="min-width: 15rem">
          <div class="flex items-center justify-between">Assignee</div>
        </th>
        <th style="min-width: 15rem">
          <div class="flex items-center justify-between">Status</div>
        </th>
        <th style="min-width: 10rem">
          <div class="flex items-center justify-between">Priority</div>
        </th>
        <th style="min-width: 10rem">
          <div class="flex items-center justify-between">Story Points</div>
        </th>
        <th style="min-width: 10rem">
          <div class="flex items-center justify-between">Created Date</div>
        </th>
        <th style="min-width: 10rem">
          <div class="flex items-center justify-between">Actions</div>
        </th>
      </tr>
    </ng-template>
    <ng-template #body let-story>
      <tr>
        <!-- Title -->
        <td>
          <div class="font-semibold">
            {{ story.title }}
          </div>
        </td>

        <!-- Assignee -->
        <td>
          <div class="flex items-center gap-2">
            <i class="pi pi-user text-primary pe-2"></i>
            <span>{{ story.assignee?.name }}</span>
          </div>
        </td>

        <!-- Status -->
        <td>
          <p-tag [value]="story.status" [severity]="statusSeverity(story.status)" />
        </td>

        <!-- Priority -->
        <td>
          <p-tag [value]="story.priority" [severity]="prioritySeverity(story.priority)" />
        </td>

        <!-- Story Points -->
        <td>
          <span class="font-medium">
            {{ story.storyPoints }}
          </span>
        </td>

        <!-- Created Date -->
        <td>
          {{ story.createdAt | date: 'MMM dd, yyyy' }}
        </td>

        <!-- Actions -->
        <td>
          <div class="flex gap-2">
            <button
              pButton
              icon="pi pi-eye"
              class="p-button-sm p-button-text p-button-info"
              (click)="viewStory(story)"
            ></button>
            <button
              pButton
              icon="pi pi-pencil"
              class="p-button-sm p-button-text"
              (click)="editStory(story)"
            ></button>

            <button
              pButton
              icon="pi pi-trash"
              class="p-button-sm p-button-text p-button-danger"
              (click)="deleteStory(story.id)"
            ></button>
          </div>
        </td>
      </tr>
    </ng-template>
    <ng-template #emptymessage>
      <tr>
        <td colspan="7">No user stories found.</td>
      </tr>
    </ng-template>
  </p-table>
</div>

<app-add-story-modal
  [(visible)]="editorOpen"
  [story]="editedStory()"
  (save)="handleSave($event)"
/>

<app-story-detail
  [visible]="detailOpen()"
  [story]="detailStory()"
  (closed)="detailOpen.set(false)"
  (edit)="editStoryFromDetail($event)"
/>
