<div class="page">
  <!-- Header -->
  <div class="topbar">

    <div class="view-switch">
      <button
        pButton
        icon="pi pi-list"
        [class.active]="view === 'list'"
        (click)="setView('list')"
      ></button>

      <button
        pButton
        icon="pi pi-th-large"
        [class.active]="view === 'card'"
        (click)="setView('card')"
      ></button>
    </div>
  </div>

  <!-- Main View -->
  <app-story-view
    [data]="stories"
    [loading]="loading"
    [view]="view"
    [loadMore]="loadMore.bind(this)"
  ></app-story-view>
</div>
