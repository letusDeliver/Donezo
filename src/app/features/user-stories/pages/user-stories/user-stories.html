<div class="card">
  <p-table
    [value]="stories"
    dataKey="id"
    [rows]="10"
    [size]="'small'"
    [rowsPerPageOptions]="[10, 25, 50]"
    [loading]="loading"
    [paginator]="true"
    showGridlines
  >
    <ng-template #caption>
      <div class="search_filter_container">
        <div class="search-field">
          <p-iconfield iconPosition="left" class="ml-auto">
            <p-inputicon>
              <i class="pi pi-search"></i>
            </p-inputicon>
            <input pInputText type="text" placeholder="Search keyword" />
          </p-iconfield>
        </div>
        <div class="add-button">
          <p-button label="New" [outlined]="true" icon="pi pi-plus" (click)="openNew()" />
        </div>
      </div>
    </ng-template>
    <ng-template #header>
      <tr>
        <th style="min-width: 15rem">
          <div class="flex items-center justify-between">Title</div>
        </th>
        <th style="min-width: 15rem">
          <div class="flex items-center justify-between">Assignee</div>
        </th>
        <th style="min-width: 15rem">
          <div class="flex items-center justify-between">Status</div>
        </th>
        <th style="min-width: 10rem">
          <div class="flex items-center justify-between">Priority</div>
        </th>
        <th style="min-width: 10rem">
          <div class="flex items-center justify-between">Story Points</div>
        </th>
        <th style="min-width: 10rem">
          <div class="flex items-center justify-between">Created Date</div>
        </th>
        <th style="min-width: 10rem">
          <div class="flex items-center justify-between">Actions</div>
        </th>
      </tr>
    </ng-template>
    <ng-template #body let-story>
      <tr>
        <!-- Title -->
        <td>
          <div class="font-semibold">
            {{ story.title }}
          </div>
          <small class="text-gray-500">
            {{ story.description }}
          </small>
        </td>

        <!-- Assignee -->
        <td>
          <div class="flex items-center gap-2">
            <i class="pi pi-user text-primary"></i>
            <span>{{ story.assignee }}</span>
          </div>
        </td>

        <!-- Status -->
        <td>
          <p-tag [value]="story.status" [severity]="getStatusSeverity(story.status)" />
        </td>

        <!-- Priority -->
        <td>
          <p-tag [value]="story.priority" [severity]="getPrioritySeverity(story.priority)" />
        </td>

        <!-- Story Points -->
        <td>
          <span class="font-medium">
            {{ story.storyPoints }}
          </span>
        </td>

        <!-- Created Date -->
        <td>
          {{ story.createdAt | date: 'MMM dd, yyyy' }}
        </td>

        <!-- Actions -->
        <td>
          <div class="flex gap-2">
            <button
              pButton
              icon="pi pi-pencil"
              class="p-button-sm p-button-text"
              (click)="editStory(story)"
            ></button>

            <button
              pButton
              icon="pi pi-trash"
              class="p-button-sm p-button-text p-button-danger"
              (click)="deleteStory(story.id)"
            ></button>
          </div>
        </td>
      </tr>
    </ng-template>
    <ng-template #emptymessage>
      <tr>
        <td colspan="7">No customers found.</td>
      </tr>
    </ng-template>
  </p-table>
</div>

<app-add-story-modal
  [visible]="showDialog"
  [story]="selectedStory"
  (visibleChange)="showDialog = $event"
  (save)="handleSave($event)"
></app-add-story-modal>
