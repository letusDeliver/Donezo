<!-- breadcrumb.html -->
<nav aria-label="Breadcrumb">
  <ol class="breadcrumb">
    @for (crumb of breadcrumbs(); track crumb.path) {
      <li class="breadcrumb-item" [class.active]="crumb.isLast">
        @if (!crumb.isLast) {
          <a [routerLink]="crumb.path">{{ crumb.label }}</a>
        }
        @if (crumb.isLast) {
          <span>{{ crumb.label }}</span>
        }
      </li>
    }
  </ol>
</nav>
